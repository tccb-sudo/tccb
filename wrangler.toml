# ============================================================
# MỘT THƯ MỤC (tccb) — 25 WORKER
# Mọi Worker trên Cloudflare nối vào CÙNG thư mục này, chỉ khác Deploy command:
#   Worker "tccb" (chính) : npx wrangler deploy
#   Worker khác, vd "tv"  : npx wrangler deploy --env tv
#
# THÊM WORKER MỚI tên <x> (tạo Worker <x> trên Cloudflare TRƯỚC):
#   1) Thêm 3 dòng vào phần "Các Worker con":
#        [env.<x>]
#        name = "<x>"
#        triggers = { crons = [] }
#   2) Thêm 1 khối [[services]] WARM_<x> ở phần "Đánh thức" (để <x> cũng được giữ ấm)
#   3) Worker <x> → Settings → Build: Deploy command = npx wrangler deploy --env <x>
# Biến APPS_SCRIPT_URL / PROXY_KEY đặt riêng trên từng Worker (keep_vars giữ nguyên khi deploy).
# ============================================================
name = "tccb"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Giữ nguyên các biến đã đặt trên dashboard mỗi lần deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api"]

# Gói miễn phí chỉ cho 5 lịch/tài khoản → CHỈ Worker tccb có lịch.
# Cứ 5 phút, 7h00–18h59 giờ Việt Nam (0h–11h UTC), tccb đánh thức Apps Script của CẢ 25 đơn vị.
[triggers]
crons = ["*/5 0-11 * * *"]

# ----- Đánh thức: tccb gọi Worker con qua service binding (không mở ra Internet) -----
[[services]]
binding = "WARM_ttgdyh"
service = "ttgdyh"
entrypoint = "Warm"

[[services]]
binding = "WARM_tv"
service = "tv"
entrypoint = "Warm"

