name = "tccb"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Giữ nguyên các biến (APPS_SCRIPT_URL, PROXY_KEY) đã đặt trên dashboard mỗi lần deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api"]

# CHỈ Worker tccb có lịch (gói miễn phí tối đa 5 lịch/tài khoản).
# Cứ 5 phút, 7h00–18h59 giờ Việt Nam (0h–11h UTC): đánh thức Apps Script của tccb
# và của mọi Worker con khai báo bên dưới (kết nối nội bộ Cloudflare, không mở ra Internet).
# Thêm Worker con mới tên <x>: tạo Worker <x> trên Cloudflare trước, rồi thêm 1 khối [[services]] như dưới.
[triggers]
crons = ["*/5 0-11 * * *"]

[[services]]
binding = "WARM_ttgdyh"
service = "ttgdyh"
entrypoint = "Warm"

[[services]]
binding = "WARM_tv"
service = "tv"
entrypoint = "Warm"

[[services]]
binding = "WARM_ttcntt"
